{% extends "base.html" %}
{% block title %}{{ _('Login') }} — {{ _('Expense Manager') }}{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon">💰</div>
        <span class="auth-logo-text">{{ _('Expense Manager') }}</span>
    </div>

    <h1>{{ _('Welcome back') }}</h1>
    <p class="subtitle">{{ _('Sign in to manage your expenses') }}</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="form" data-loading style="margin-top: 1.5rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">{{ _('Email') }}</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label for="password">{{ _('Password') }}</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block">{{ _('Sign in') }}</button>
    </form>

    <p class="auth-footer">
        {{ _("Don't have an account?") }}
        <a href="{{ url_for('auth.register') }}">{{ _('Create one') }}</a>
    </p>
</div>
{% endblock %}
